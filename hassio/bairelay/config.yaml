slug: bairelay
name: Bairelay
version: "1.1.2"
description: RTSP / MQTT bridge for Reolink battery cameras
url: https://github.com/mgc8/bairelay
arch:
  - amd64
  - aarch64
init: false
host_network: true
services:
  - mqtt:want
ports:
  8554/tcp: 8554
  8555/tcp: 8555
  9999/udp: 9999
  58200/udp: 58200
map:
  - homeassistant_config:rw
  - ssl
options:
  topic_prefix: bairelay
  log_level: info
  cameras: []
  wake_server: {}
schema:
  topic_prefix: str
  log_level: list(info|debug|trace)
  cameras:
    - name: match(^[A-Za-z0-9_-]+$)
      address: str?
      uid: str?
      username: str?
      password: password
      idle_disconnect: bool?
      # Rhythms this camera may be asked about. Every key is optional: a field
      # left blank keeps what the bridge does today.
      idle_disconnect_timeout_secs: float?
      probe_session_secs: int?
      motion_wake_hold_secs: float?
      # Capped on purpose. The bridge can be told by file to search a camera
      # through the Reolink cloud; the form on this network does not offer it.
      discovery: list(none|local)?
  wake_server:
    enable: bool?
    heartbeat_ms: int?
    stale_after_ms: int?
    hb_advice_ms: int?
    explain_declared_uid: bool?
image: ghcr.io/mgc8/bairelay-hassio-{arch}
