# Bairelay configuration. This file is merged with the bairelay app's
# options form on every start. The form supplies the base; this file
# overrides field-by-field, matched per-camera by `name`. Edit anything;
# changes take effect on the next restart.
#
# This template is written once on first start of the app. After that,
# you own it — bairelay never rewrites it. Every commented-out key shows
# its default value.

bind = "0.0.0.0"
# bind_port = 8554

# TLS server. Plain RTSP keeps running on bind_port; TLS adds a second
# listener on tls_bind_port. Set bind_port = 0 to disable plain.
# certificate = "/path/to/cert-and-key.pem"   # PEM with cert chain + key
# tls_bind_port = 8555
# tls_client_auth = "none"   # none | request | require
# tls_client_ca = "/path/to/ca.pem"   # required when client_auth != none

# Grace window before idle StreamSources are pruned. 0 disables.
# Keep ≤ each camera's idle_disconnect_timeout_secs so the source
# can never outlive the Baichuan session it pulls from.
# stream_prune_grace_secs = 30


# RTSP user accounts. Without any [[users]], connections are anonymous.
# [[users]]
# name = "me"
# pass = "my-password"


# MQTT bridge. The bairelay app auto-injects the broker, port, username,
# and password from HA's Mosquitto integration on every start. Override
# any field by uncommenting it below. Remove the [mqtt] block entirely
# to run RTSP-only.
# [mqtt]
# broker_addr = "192.168.1.50"
# port = 1883
# credentials = ["user", "password"]
# ca = "/path/to/broker-ca.pem"
# client_auth = ["/path/to/client.pem", "/path/to/client.key"]

# Root segment for every owned MQTT topic and HA discovery
# unique_id/identifier. Set to "neolink" for legacy migration.
# topic_prefix = "bairelay"

# HA MQTT discovery. Presence of [mqtt.discovery] enables it.
# [mqtt.discovery]
# topic = "homeassistant"
# features = [
#     "floodlight", "camera", "motion", "motion_class", "push", "led",
#     "ir", "reboot", "pt", "battery", "siren",
# ]


# Local wake server.
# Replaces Reolink's cloud P2P servers for waking battery cameras.
# Operator must redirect DNS for p2p*.reolink.com to this box.
# [wake_server]
# enable = false             # opt-in
# middleman_port = 9999      # UDP, C2M_Q listener
# register_port = 58200      # UDP, D2R_HB / C2R_C / D2R_DISC listener
# heartbeat_ms = 20000       # echoed to cameras in R2D_HB_R
# stale_after_ms = 80000     # registry entries older than this read as None


# Motion-push listener.
# Treats the camera's TCP connect to pushx.reolink.com as a motion event.
# Operator must redirect DNS for pushx.reolink.com to push_listener_addr.
# The pushing camera is found by source IP: via [wake_server]'s heartbeat
# registry when enabled, else by a camera's IP `address` (give it a DHCP
# reservation). Without the wake server, p2p*.reolink.com stays with
# Reolink, so the Reolink app keeps working.
# [push_listener]
# enable = false                       # opt-in
# push_listener_addr = "0.0.0.0"       # default: wake_server bind / top-level bind
# push_listener_port = 443             # override when 443 is taken
# motion_wake_hold_secs = 30           # wake-lock window per push event
# forward_upstream = false             # also relay each push, bytes only, to
#                                      # the real pushx.reolink.com so the
#                                      # Reolink app still gets notified
# upstream_resolver = "1.1.1.1"        # DNS server forwarding asks for the
#                                      # real pushx; not your LAN resolver


# ── Cameras ──
# Cameras come from the bairelay app's options form. Add a [[cameras]]
# block here only when you need to override per-camera fields the form
# doesn't expose (channel_id, stream, discovery, max_encryption, MQTT
# discovery features, pause behaviour, etc.). The `name` field must
# match the form entry exactly. Example:
#
# [[cameras]]
# name = "Cam1"                      # must match the form's `name`
# channel_id = 0
# stream = "all"                     # none | all | main | sub | extern
# discovery = "local"                # local | remote | map | relay | cellular
# max_encryption = "aes"             # none | aes | bcencrypt
# idle_disconnect_timeout_secs = 45  # grace period before sleep
# motion_wake_hold_secs = 30         # wake-lock hold after motion stops
# permitted_users = ["me"]
#
# [cameras.mqtt]
# enable_motion     = true
# enable_light      = true           # status LED
# enable_battery    = true
# battery_update    = 2000           # ms, min 500
# enable_preview    = true
# preview_update    = 2000           # ms, min 500
# enable_floodlight = false
# floodlight_update = 2000           # ms, min 500
# enable_pir        = false
#
# [cameras.pause]
# bridge_gaps = true                 # fill gaps with last frame
# gap_threshold_secs = 1.0           # raise for low-fps sub streams
# preview_overlay = true             # CONNECTING/SLEEPING caption on preview JPEG
