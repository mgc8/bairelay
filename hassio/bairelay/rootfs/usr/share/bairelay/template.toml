# Bairelay configuration. This file is merged with the bairelay app's
# options form on every start. The form supplies the base; this file
# overrides field-by-field, matched per-camera by `name`. Edit anything;
# changes take effect on the next restart.
#
# This template is written once on first start of the app. After that,
# you own it — bairelay never rewrites it. Every commented-out key shows
# its default value.

bind = "0.0.0.0"
# bind_port = 8554

# TLS server. Plain RTSP keeps running on bind_port; TLS adds a second
# listener on tls_bind_port. Set bind_port = 0 to disable plain.
# certificate = "/path/to/cert-and-key.pem"   # PEM with cert chain + key
# tls_bind_port = 8555
# tls_client_auth = "none"   # none | request | require
# tls_client_ca = "/path/to/ca.pem"   # required when client_auth != none

# Grace window before idle StreamSources are pruned. 0 disables.
# Keep ≤ each camera's idle_disconnect_timeout_secs so the source
# can never outlive the Baichuan session it pulls from.
# stream_prune_grace_secs = 30


# RTSP user accounts. Without any [[users]], connections are anonymous.
# [[users]]
# name = "me"
# pass = "my-password"


# MQTT bridge. The bairelay app auto-injects the broker, port, username,
# and password from HA's Mosquitto integration on every start. Override
# any field by uncommenting it below. Remove the [mqtt] block entirely
# to run RTSP-only.
# [mqtt]
# broker_addr = "192.168.1.50"
# port = 1883
# credentials = ["user", "password"]
# ca = "/path/to/broker-ca.pem"
# client_auth = ["/path/to/client.pem", "/path/to/client.key"]

# Root segment for every owned MQTT topic and HA discovery
# unique_id/identifier. Set to "neolink" for legacy migration.
# topic_prefix = "bairelay"

# HA MQTT discovery. Presence of [mqtt.discovery] enables it.
# [mqtt.discovery]
# topic = "homeassistant"
# features = [
#     "floodlight", "camera", "motion", "led", "ir",
#     "reboot", "pt", "battery", "siren",
# ]


# Local wake server.
# Replaces Reolink's cloud P2P servers for waking battery cameras.
# Operator must redirect DNS for p2p*.reolink.com to this box.
# [wake_server]
# enable = false             # opt-in
# middleman_port = 9999      # UDP, C2M_Q listener
# register_port = 58200      # UDP, D2R_HB / C2R_C / D2R_DISC listener
# heartbeat_ms = 20000       # echoed to cameras in R2D_HB_R
# hb_advice_ms = 10000       # what to advertise instead of heartbeat_ms
#   Advice only. The firmware sets its own pace (about 10 s observed on this
#   network), so this changes what this bridge says, never what it hears. It is
#   here because advertising a cadence the camera ignores makes the advertising
#   useless, not because a camera obeys it.
# explain_declared_uid = false # spell out why a refused wake request named a
#   # camera this bridge declares, instead of the generic unknown-or-stale line.
#   The answer to the client does not change: it stays rsp = -1.
# stale_after_ms = 80000     # registry entries older than this read as None
#   One window, three jobs, which is why it is not a knob to push up casually:
#   it is how long a camera stays listed between beats, how long the motion-push
#   listener still reconciles a connection to a camera by source IP, and the real
#   lifetime of the anchor a camera leaves behind.
#   Measured in this tree on 2026-11-14, not assumed: the cloud-facing middleman
#   answers for an anchor up to one hour old (its lookup uses a fixed one-hour
#   window, `lookup_ttl`), while a wake request is refused as soon as the
#   registry entry passes `stale_after_ms`, which is 80 s at the default
#   (`lookup_fresh`). A client that trusts the hour it was given therefore asks
#   for a wake 81 seconds after the last beat, is refused, and the camera stays
#   asleep with nothing in the log that names the reason. Widening this keeps
#   cameras listed longer, including ones that have changed address; read the
#   three jobs above before you do it.


# Motion-push listener.
# Treats the camera's TCP connect to pushx.reolink.com as a motion event.
# Operator must redirect DNS for pushx.reolink.com to push_listener_addr.
# [push_listener]
# enable = false                       # opt-in
# push_listener_addr = "0.0.0.0"       # default: wake_server bind / top-level bind
# push_listener_port = 443             # override when 443 is taken
# motion_wake_hold_secs = 30           # wake-lock window per push event


# HaCfg webhook listener for cameras with webhook = true (battery doorbells).
# Arming replaces any other webhook URL on the camera (e.g. HA's Reolink integration).
# [webhook]
# enable = false                       # opt-in
# webhook_addr = "0.0.0.0"             # default: top-level bind
# webhook_port = 8780
# webhook_advertise = "10.0.0.5:8780"  # host:port cameras POST to
# motion_wake_hold_secs = 30           # wake-lock window per webhook event


# Ask the LAN which cameras exist, instead of writing them in the form.
# The form has no field for this one, because it is not a rhythm to tune:
# it broadcasts the protocol's any-camera request once at startup, listens
# `wait_secs`, and manages whatever answers and names itself — at the
# address it answered from, with `discovery = "local"`, using the
# credentials below. A camera you put in the form is never added twice.
# Without both username and password here, a camera that answers is named
# in the log and left alone: its credentials cannot be guessed. The
# broadcast can wake a sleeping battery camera, so it is off until you say
# otherwise. See docs/settings.md ("Cameras discovered at startup").
# [startup_discovery]
# enable = false                       # opt-in; off means nothing is broadcast
# wait_secs = 5                        # 1..=60; startup waits this long, no longer
# username = "admin"                   # both halves are needed to adopt a camera
# password = "camera-password"


# ── Cameras ──
# Cameras come from the bairelay app's options form. Add a [[cameras]]
# block here only when you need to override per-camera fields the form
# doesn't expose (channel_id, stream, discovery, max_encryption, MQTT
# discovery features, pause behaviour, etc.). The `name` field must
# match the form entry exactly. Example:
#
# [[cameras]]
# name = "Cam1"                      # must match the form's `name`
# channel_id = 0
# stream = "all"                     # none | all | main | sub | extern
#   Which streams this camera may serve, whatever the URL suffix asks
#   for. "sub" still answers /extern (on the substream); "main" refuses
#   it. A refused request never wakes the camera.
# discovery = "local"                # local | remote | map | relay | cellular
# max_encryption = "aes"             # none | aes | bcencrypt
# idle_disconnect_timeout_secs = 45  # grace period before sleep
# motion_wake_hold_secs = 30         # wake-lock hold after motion stops
# probe_session_secs = 5     # how often a live session is checked; 0 = never
#   With 0 a session that dies silently is not noticed by this bridge: it closes
#   on the grace period or on an explicit disconnect only.
# retry_after_secs = 0       # one further attempt, this many seconds after a
#   # failed contact, then stop. 0 = no further attempt. Applies only while the
#   # camera is parked, so it needs idle_disconnect = true; the attempt is TCP
#   # only, at an address this bridge can prove, and it never searches for the
#   # camera. A retry somebody asked for by hand keeps the full reach.
# permitted_users = ["me"]
# webhook = false                    # report wake reasons via [webhook]; needs [webhook] enable
#
# [cameras.mqtt]
# enable_motion     = true
# enable_light      = true           # status LED
# enable_battery    = true
# battery_update    = 2000           # ms, min 500
# enable_preview    = true
# preview_update    = 2000           # ms, min 500
# enable_floodlight = false
# floodlight_update = 2000           # ms, min 500
# enable_pir        = false
#
# [cameras.pause]
# bridge_gaps = true                 # fill gaps with last frame
# gap_threshold_secs = 1.0           # raise for low-fps sub streams
# preview_overlay = true             # CONNECTING/SLEEPING caption on preview JPEG
