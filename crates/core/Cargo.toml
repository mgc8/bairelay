[package]
name = "bairelay-neolink-core"
description = "Reolink Baichuan protocol core for bairelay. Modernised vendor of the original neolink_core by thirtythreeforty + QuantumEntangledAndy (https://github.com/QuantumEntangledAndy/neolink)."
version.workspace = true
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aes = "0.8.2"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.4.0"
cfb-mode = "0.8.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
cookie-factory = "0.3.2"
crc32fast = "1.3.2"
crossbeam-channel = "0.5.8"
delegate = "0.12.0"
futures = "0.3.28"
get_if_addrs = "0.5.3"
lazy_static = "1.4.0"
log = "0.4.17"
md5 = "0.7.0"
nom = { version = "7.1.3", features = ["alloc"] }
quick-xml.workspace = true
rand = "0.8.5"
regex = "1.7.3"
# Cloud bundle minting for account ("cloud") cameras: HTTPS to
# apis.reolink.com. rustls-tls (no OpenSSL) + gzip + json.
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"gzip",
	"json",
	"charset",
	"http2",
] }
serde = { version = "1.0.106", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3.36" , features = [ "macros", "parsing", "local-offset" ]}
tokio = { version = "1.27.0", features = ["full"] }
tokio-stream = { version = "0.1.12", features = ["sync", "time", "net"] }
tokio-util = { version = "0.7.7", features = ["full", "tracing"] }
zeroize = "1.8"

[features]
# Exposes the in-process test scaffolding (`FakeCamera*`,
# `MockConnection*`, `BcCamera::from_mock_connection`,
# `BcCamera::test_set_ability`, `MotionData::test_new`) to *external*
# test crates. Off by default so release builds cannot accidentally
# substitute a fake for a real camera. The crate's own `cfg(test)`
# unit tests are unaffected — they always see the test scaffolding.
# Downstream test crates opt in via `[dev-dependencies]
# bairelay_neolink_core = { ..., features = ["test-util"] }`.
test-util = []

# Exposes a small `fuzz_api` module with public shims around otherwise
# `pub(crate)` parsers (`Bc::deserialize`, `BcXml::try_parse`) so the
# out-of-tree `fuzz/` crate (libfuzzer-sys) can drive them. Off by
# default — production builds never compile these surfaces.
fuzz-api = []

# Exposes a `pcap_decode_api` module with the offline-decoder primitives
# (`Session`, `Direction`) used by `tests/scripts/decode-bc-pcap` to drive
# Bc/BcUdp parsing + AES-CFB decryption against a captured BcUdp session.
# Off by default — debugging-only surface, never compiled into release.
pcap-decode-api = []

[dev-dependencies]
assert_matches = "1.5.0"
env_logger = "0.11"
indoc = "2.0.1"
# test-util brings in the virtual clock (`tokio::time::pause`,
# `tokio::time::advance`, `#[tokio::test(start_paused = true)]`) that
# Stage 6's discovery-chain and keepalive tests use to drive per-step
# timeouts without real sleeps.
tokio = { version = "1.27.0", features = ["full", "test-util"] }
# Property-based fuzz / round-trip testing for the protocol parsers
# (BcMedia framing, BcUdp framing, XML payloads). The contract under
# test is "any byte input either parses to a valid value or returns an
# error — never panics or hangs".
proptest = "1"

