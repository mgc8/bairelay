[package]
name = "bairelay-mqtt"
description = "MQTT bridge + Home Assistant discovery primitives for bairelay. Topic scheme and HA discovery payloads derive from the MQTT bridge added to neolink by QuantumEntangledAndy (https://github.com/QuantumEntangledAndy/neolink)."
version.workspace = true
authors = ["Andrew King <sheepchaan@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# OS trust store for `[mqtt] tls = true` without `ca`. Same version
# rumqttc already pulls in.
rustls-native-certs = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"

