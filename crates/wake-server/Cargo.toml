[package]
name = "bairelay-wake-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Local replacement for Reolink's P2P cloud servers; wakes battery cameras over the LAN."

[dependencies]
bairelay-neolink-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
quick-xml.workspace = true
bytes = "1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util", "sync"] }
toml = "0.8"
