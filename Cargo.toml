[package]
name = "bairelay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RTSP Relay for Reolink Baichuan cameras"
readme = "README.md"

# Trim the .crate for crates.io users. Everything below is dev/repo
# infrastructure or distributed via separate channels (HAOS add-on
# via ghcr.io). `cargo install bairelay` only needs src/, the
# integration tests, and the operator-facing docs.
exclude = [
	"/.github/",
	"/.gitignore",
	"/codecov.yml",
	"/hassio/",
	"/repository.yaml",
	"/rust-toolchain.toml",
	"/rustfmt.toml",
	"/scripts/",
	"/tarpaulin.toml",
	"/tests/fixtures/",
	"/tests/ha-token",
	"/tests/logs/",
	"/tests/scripts/",
]

[workspace]
members = [
	"crates/*",
]
# `fuzz/` is its own detached cargo project (libfuzzer-sys + nightly).
# Excluding it keeps `cargo build/test --workspace` from walking it
# and dragging in nightly-only deps. `tests/scripts/decode-bc-pcap/` is
# similarly detached: a debugging-only tool that opts bairelay_neolink_core into
# the `pcap-decode-api` feature, kept out of the workspace so the feature
# is never accidentally pulled into a release build.
exclude = ["fuzz", "tests/scripts/decode-bc-pcap"]
# Without this, bare `cargo test` / `cargo build` / `cargo clippy`
# from the workspace root operates only on the root crate and silently
# skips every member crate (bairelay_neolink_core's ~686 tests included). The
# `--workspace` flag works either way; this just makes the bare form
# do the right thing.
default-members = [
	".",
	"crates/core",
	"crates/mqtt",
	"crates/rtsp",
	"crates/wake-server",
]

# Single source of truth for version / edition / license across the
# workspace. Bumping `version` here cascades to every member crate;
# `build.rs` picks up the same value via CARGO_PKG_VERSION_{MAJOR,MINOR}
# and resets the build counter when the prefix changes.
[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mgc8/bairelay"
homepage = "https://github.com/mgc8/bairelay"
keywords = ["reolink", "rtsp", "mqtt", "baichuan", "home-assistant"]
categories = ["multimedia::video", "network-programming"]

# Internal path deps in one place. The `version` field is what
# crates.io consults on `cargo publish`; the `path` field is what
# local dev resolves against. `release.sh::update_workspace_version`
# bumps these four version strings in lockstep with the workspace
# `version` above — keep the `version = "X.Y.Z"` shape so the sed
# pattern keeps matching.
[workspace.dependencies]
bairelay-neolink-core = { path = "crates/core", version = "1.1.2" }
bairelay-mqtt = { path = "crates/mqtt", version = "1.1.2" }
bairelay-rtsp = { path = "crates/rtsp", version = "1.1.2" }
bairelay-wake-server = { path = "crates/wake-server", version = "1.1.2" }

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bytes = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ab_glyph = "0.2"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }

bairelay-neolink-core.workspace = true
bairelay-mqtt.workspace = true
bairelay-rtsp.workspace = true
bairelay-wake-server.workspace = true

rustls = "0.23"
rustls-pemfile = "2"
# No-echo TTY input + plain-stdin read for `users add` / `users password`
# when the operator omits the password positional. Keeps the secret out
# of `ps auxww`, shell history, and supervisor argv-capture logs.
rpassword = "7"

# Strip symbols from release builds via rustc itself, not a post-build
# `strip` step. The cross-compile aarch64-musl release matrix cell can't
# rely on the runner's host `strip` (x86_64 only), and asking cargo to
# do it is uniform across every target and Cargo profile-aware. Keep
# `strip = "symbols"` (not `"debuginfo"`) — the release artifact is for
# operators, not core dumps; debug-mode local builds keep full info.
#
# Release artefact path scrubbing happens via `--remap-path-prefix` in
# `release.yml` (stable rustc flag). The unified `trim-paths` profile
# key is still unstable in Cargo 1.95 — revisit when it stabilises.
[profile.release]
strip = "symbols"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rcgen = "0.13"

# Enable bairelay_neolink_core's test scaffolding (`FakeCamera*`, `MockConnection*`,
# `BcCamera::from_mock_connection`, `MotionData::test_new`) for the
# binary's own test suite. The feature is off in production builds, so
# release `bairelay` cannot accidentally substitute a fake for a real
# camera.
bairelay-neolink-core = { workspace = true, features = ["test-util"] }

# tests/fixture_replay.rs drives the real RtspServer::serve over a TCP
# socket and hand-parses RTP/RTCP bytes off the wire. That requires
# tokio's net + io-util feature flags (not pulled in by the runtime
# crate's default feature set). `test-util` enables the virtual-time
# clock (`tokio::time::advance`, `start_paused = true`) used by the
# gap-detection unit tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
