# Bairelay sample configuration. Copy to config.toml and edit.
# Every commented-out key shows its default.

bind = "0.0.0.0"
# bind_port = 8554

# Reolink account, for cameras with discovery = "cloud" (account-bound cameras
# that only accept the cloud-token sigV3 login). Shared by all cloud cameras.
# cloud_account = "you@example.com"
# cloud_password = "your-reolink-password"

# TLS server. Plain RTSP keeps running on bind_port; TLS adds a second
# listener on tls_bind_port. Set bind_port = 0 to disable plain.
# certificate = "/path/to/cert-and-key.pem"   # PEM with cert chain + key
# tls_bind_port = 8555
# tls_client_auth = "none"   # none | request | require
# tls_client_ca = "/path/to/ca.pem"   # required when client_auth != none

# Grace window before idle StreamSources are pruned. 0 disables.
# Keep ≤ each camera's idle_disconnect_timeout_secs so the source
# can never outlive the Baichuan session it pulls from.
# stream_prune_grace_secs = 30


# RTSP user accounts. Without any [[users]], connections are anonymous.
# [[users]]
# name = "me"
# pass = "my-password"


# MQTT bridge. Remove the [mqtt] block to run RTSP-only.
# [mqtt]
# broker_addr = "192.168.1.50"
# port = 1883
# credentials = ["user", "password"]
# TLS to the broker (port usually 8883). tls = true alone trusts the
# system CA store; ca (path or inline PEM) is for a private CA.
# tls = true
# ca = "/path/to/broker-ca.pem"
# client_auth = ["/path/to/client.pem", "/path/to/client.key"]

# Root segment for every owned MQTT topic and HA discovery
# unique_id/identifier. Set to "neolink" for legacy migration.
# topic_prefix = "bairelay"

# HA MQTT discovery. Presence of [mqtt.discovery] enables it.
# [mqtt.discovery]
# topic = "homeassistant"
# features = [
#     "floodlight", "camera", "motion", "led", "ir",
#     "reboot", "pt", "battery", "siren", "ai", "doorbell",
# ]


# Local wake server.
# Replaces Reolink's cloud P2P servers for waking battery cameras.
# Operator must redirect DNS for p2p*.reolink.com to this box.
# [wake_server]
# enable = false             # opt-in
# middleman_port = 9999      # UDP, C2M_Q listener
# register_port = 58200      # UDP, D2R_HB / C2R_C / D2R_DISC listener
# heartbeat_ms = 20000       # cadence we assume: stale_after_ms must cover it,
#                          # and it is what R2D_HB_R carries when hb_advice_ms is unset
# hb_advice_ms = 20000     # cadence advertised in R2D_HB_R. Advice only: the
#                          # firmware sets its own pace (about 10 s observed), so
#                          # this changes what we say, never what we hear
# stale_after_ms = 80000   # registry entries older than this read as None
# explain_declared_uid = false # log the real reason when a refused wake request
#                          # names a camera this bridge declares: the answer to the
#                          # client stays rsp = -1, nothing is invented, only the
#                          # sentence changes


# Motion-push listener.
# Treats the camera's TCP connect to pushx.reolink.com as a motion event.
# Operator must redirect DNS for pushx.reolink.com to push_listener_addr.
# [push_listener]
# enable = false                       # opt-in
# push_listener_addr = "0.0.0.0"       # default: wake_server bind / top-level bind
# push_listener_port = 443             # override when 443 is taken
# motion_wake_hold_secs = 30           # wake-lock window per push event


# HaCfg webhook listener for cameras with webhook = true (battery doorbells).
# Arming replaces any other webhook URL on the camera (e.g. HA's Reolink integration).
# [webhook]
# enable = false                       # opt-in
# webhook_addr = "0.0.0.0"             # default: top-level bind
# webhook_port = 8780
# webhook_advertise = "10.0.0.5:8780"  # host:port cameras POST to
# motion_wake_hold_secs = 30           # wake-lock window per webhook event


# Startup discovery: let the network say which cameras exist.
# Off unless enable = true. When it is on, bairelay broadcasts the protocol's
# any-camera discovery request (UDP broadcast to port 2015) once at startup,
# listens for wait_secs, and adds every camera that answers and names itself:
# address = the address it answered from, discovery = "local", credentials = the
# pair below. Nothing else is invented — no port is guessed, no address is
# tried, no password is borrowed from another camera.
# A camera that is already in [[cameras]] is never added a second time: the
# declaration wins, with every field written in it. With no username and
# password here, a camera that answers is named in a warning and left alone.
# What it costs: the broadcast is a wake-up call that a battery camera pays for
# in battery. And no capture in this project has ever shown a camera answering a
# request that does not name it, so a window that hears nothing is a warning and
# not a failure — the bridge carries on with the cameras declared below.
# [startup_discovery]
# enable = false                       # opt-in; off means nothing is broadcast
# wait_secs = 5                        # 1..=60; startup waits this long, no longer
# username = "admin"                   # both halves are needed to adopt a camera
# password = "camera-password"


# ── Cameras ──
# Name must match [A-Za-z0-9_-]+. Address OR uid is required.

[[cameras]]
name = "driveway"
username = "admin"
password = "camera-password"
address = "192.168.1.187:9000"   # ip or hostname, optional :port
# uid = "ABCDEF1234567890"
# channel_id = 0
# stream = "all"              # none | all | main | sub | extern
#                             # Which streams this camera may serve, whatever the
#                             # URL suffix asks for: main/sub/extern answer that
#                             # one only, all (the default) answers every one, none
#                             # answers none. A /extern request on a camera set to
#                             # "sub" is served the substream; on one set to "main"
#                             # it fails. A refused request never wakes the camera.
# discovery = "relay"         # local | remote | map | relay | cellular | cloud
# max_encryption = "aes"      # none | aes | bcencrypt
# idle_disconnect = false     # true for battery cams
# idle_disconnect_timeout_secs = 45  # grace period before sleep
# motion_wake_hold_secs = 30  # wake-lock hold after motion stops
# enabled = true
# permitted_users = ["me"]
# debug = false               # trace-dump decrypted protocol payloads; logs credential hashes
# webhook = false             # report wake reasons via [webhook]; needs [webhook] enable
# two_way_audio = false       # talk path on cameras whose abilityInfo omits the ability; see docs/two-way-audio.md

# Media pacer buffering. Every decoded frame waits in a per-source pacer that
# re-emits it at the codec's own rate. *_pacer_latency_ms is the wait paid by
# the FIRST frame — the pre-buffer, and the floor on how late the picture a
# viewer sees is; *_pacer_max_lead_ms is how far the emit cursor may run ahead
# while the camera bursts. The defaults suit mpv-over-RTSP, which re-buffers
# every couple of seconds without them; a go2rtc / WebRTC consumer re-buffers
# on its own and wants much less — try 300 / 800 / 200 / 600 for a doorbell you
# watch live. A cap set below its own latency is raised to the latency at
# startup, with a warning. To see what the pacer is actually costing, run with
# RUST_LOG=debug,bairelay=debug and read the wait out of the per-frame line
# "pacer emitted frame ... ms=<wait> queued=<depth>".
# video_pacer_latency_ms = 1500
# video_pacer_max_lead_ms = 3000
# audio_pacer_latency_ms = 500
# audio_pacer_max_lead_ms = 2000

# [cameras.mqtt]
# enable_motion     = true    # also carries AI objects + doorbell presses
# enable_light      = true    # status LED
# enable_battery    = true    # false for mains-powered models (no battery)
# battery_update    = 2000    # ms, min 500
# enable_preview    = true
# preview_update    = 2000    # ms, min 500
# enable_floodlight = false
# floodlight_update = 2000    # ms, min 500
# enable_pir        = false

# [cameras.pause]
# Fill gaps from the camera (wake / reconnect / stall) with the last
# frame so RTSP clients don't see a spinner. Default true.
# bridge_gaps = true
# Seconds without a live frame before a gap starts. Raise for
# sub streams with naturally low fps. Default 3.0.
# gap_threshold_secs = 3.0
# Draw a CONNECTING/SLEEPING caption on the MQTT preview JPEG.
# Default true.
# preview_overlay = true
#
# Neolink migration compat (all accepted with a startup warning):
#   on_motion, on_client, on_disconnect, motion_timeout, mode
# have no effect in bairelay and can be removed.
# timeout = 30  # deprecated alias for idle_disconnect_timeout_secs


[[cameras]]
name = "backyard"
username = "admin"
password = "another-password"
address = "192.168.1.188:9000"
stream = "main"
