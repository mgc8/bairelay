name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# Workflow-level default. No CI job needs write — fmt/clippy/rustdoc/test/
# coverage only read code; Codecov uploads use CODECOV_TOKEN.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Opt third-party JS actions (codecov-action, taiki-e/install-action,
  # etc.) onto Node 24 ahead of GitHub's 2026-06-02 default flip. Some
  # of these actions still bundle Node 20 internally and trip the
  # runner's deprecation warning until they re-release. Becomes a
  # no-op once Node 24 is the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # No toolchain action: rustup installs the version + components pinned
      # in rust-toolchain.toml. An action that sets RUSTUP_TOOLCHAIN would
      # override that pin.
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps

  hassio-lint:
    name: hassio lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: hassio/bairelay/Dockerfile
      - name: HA add-on config lint
        uses: frenck/action-addon-linter@v2
        with:
          path: hassio/bairelay

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  coverage:
    name: coverage (tarpaulin)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Pre-built binary install — avoids the ~3-5 min `cargo install`
      # rebuild that would otherwise run on every CI invocation.
      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          # Version-pinned for the same reason the toolchain is: an
          # unpinned tool floats to its latest release and can turn CI
          # red with no code change.
          tool: cargo-tarpaulin@0.37.0
      # Tarpaulin reads workspace = true / fail-under = 87 from
      # tarpaulin.toml. The job exits non-zero when coverage drops
      # below that floor, so the gate is now mechanically enforced
      # alongside fmt + clippy + test.
      - name: Run coverage
        run: |
          set -o pipefail
          cargo tarpaulin --locked --out stdout --out xml | tee tarpaulin.txt
      - name: Append coverage to job summary
        if: always()
        run: |
          if [ ! -f tarpaulin.txt ]; then
            echo "tarpaulin.txt not found — coverage step likely failed before producing output" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary_line="$(grep -E '^[0-9]+\.[0-9]+% coverage' tarpaulin.txt | tail -1 || true)"
          {
            echo "## Coverage"
            echo
            if [ -n "$summary_line" ]; then
              echo "**$summary_line**"
            else
              echo "_summary line not found in tarpaulin output_"
            fi
            echo
            echo "<details><summary>Full tarpaulin report</summary>"
            echo
            echo '```'
            cat tarpaulin.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tarpaulin-cobertura
          path: cobertura.xml
          if-no-files-found: warn
      # Token avoids Codecov's tokenless-upload rate limits on public
      # repos. fail_ci_if_error is off so a Codecov hiccup doesn't
      # tank the CI run; the cobertura artifact above is still the
      # source of truth.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
